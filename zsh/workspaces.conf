# Directory-scoped environment overrides.
# Format: <workspace-path> <env-file>
#   workspace-path: absolute path or ~-prefixed path
#   env-file: filename under workspaces/ (or an absolute path)
#
# Longest matching path wins when directories overlap.
# Example:
#   ~/Codes/Hunar.ai/client  client.env
#   ~/Codes/Hunar.ai         hunar.env

~/Codes/Hunar.ai hunar.env
